# voice-reader.jaysoncleofas.com -> the voice_reader container on 127.0.0.1:8060
#
# Install:
#   scp deploy/nginx/voice-reader.conf root@SERVER:/etc/nginx/sites-available/voice-reader
#   ln -s /etc/nginx/sites-available/voice-reader /etc/nginx/sites-enabled/voice-reader
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d voice-reader.jaysoncleofas.com

# Named uniquely: sites-enabled files share one http context, so a generic
# $connection_upgrade would collide with another site's map.
map $http_upgrade $voice_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream voice_reader {
    server 127.0.0.1:8060;
    keepalive 32;
}

server {
    server_name voice-reader.jaysoncleofas.com;

    # Reference recordings post as multipart; the API itself caps them at 25MB.
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://voice_reader;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # NiceGUI drives the whole UI over a websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voice_connection_upgrade;

        # Cloning is CPU-bound: ~10s warm, and several minutes on the very first
        # call while the 1.8GB model downloads. The default 60s read timeout
        # would turn that into a 504.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    listen 80;
    listen [::]:80;
}
